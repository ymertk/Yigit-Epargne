<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mon Patrimoine</title>
<style>
:root{
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#8a8f8d;
  --bg:#f4f6f5; --card:#fff; --ink:#15201d; --mute:#65736f; --line:#e3e8e6;
  --pri:#4338ca; --pri2:#e0e7ff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;--c7:#9085e9;--c8:#7d8784;--bg:#0d1312; --card:#151d1b; --ink:#e7efec; --mute:#93a39e; --line:#24302d; --pri:#a5b4fc; --pri2:#25275a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none;touch-action:pan-y}
body{position:relative}
@media (display-mode: standalone){ header{padding-top:calc(max(env(safe-area-inset-top), 50px) + 6px) !important} }
header{max-width:100%;position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header small{color:var(--mute)}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 2px 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .l{font-size:12px;color:var(--mute)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--mute)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
@media (prefers-color-scheme:dark){.btn{color:#04201c}}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.sm{padding:6px 10px;font-size:13px}
.icon{background:none;border:0;color:var(--mute);padding:6px;font-size:18px;line-height:1}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mute)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.pill.h{background:#fde2e2;color:#b91c1c} .pill.m{background:#fdf0d5;color:#92400e}
@media (prefers-color-scheme:dark){.pill.h{background:#3b1414;color:#fca5a5}.pill.m{background:#3a2a0c;color:#fcd34d}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;color:var(--mute);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:18px 6px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
@media (prefers-color-scheme:dark){.fab{color:#04201c}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{overflow-x:hidden;background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=date],input[type=month],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
input::-webkit-date-and-time-value{text-align:left}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.note{font-size:12px;color:var(--mute)}
.tip{border-left:4px solid var(--pri);padding:8px 10px;background:var(--pri2);border-radius:8px;margin:8px 0;font-size:14px}
.tip.w{border-color:var(--warn);background:rgba(245,158,11,.12)}
.tip.b{border-color:var(--bad);background:rgba(239,68,68,.12)}
.pie-wrap{display:flex;gap:14px;align-items:center}
.pie-wrap svg{flex:none;width:150px;height:150px}
.pie-wrap svg path{cursor:pointer;transition:opacity .15s}
.pie-legend{flex:1;min-width:0}
.pie-legend .li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;font-size:13px;cursor:pointer}
.pie-legend .li.on{background:var(--pri2)}
.pie-legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.pie-legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-legend .pc{color:var(--mute);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.pie-legend .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.pie-wrap{flex-direction:column;align-items:stretch;gap:8px}.pie-wrap svg{align-self:center;width:170px;height:170px}}
.segbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--line)}
.segbar i{display:block;height:100%}
.hist-row{cursor:pointer}
.hist-row.on{background:var(--pri2);margin:0 -14px;padding-left:14px;padding-right:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Mon Patrimoine</h1><small id="subtitle"></small></div>
  <button class="icon" id="btnSettings" aria-label="Réglages">⚙️</button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>
<nav id="nav"></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== Veri ================== */
/* Configuration de cette copie de l'application (voir build) */
const APP_CFG = {key:'patrimoine.v1', name:'Mon Patrimoine', focus:'patrimoine'};
const KEY = APP_CFG.key;
const DEF = {
  todos: [], expenses: [], installments: [], recurring: [], credits: [], catRules: {},
  assets: [], debts: [], goals: [], budgets: {}, prices: {},
  settings: { income: 0 }
};
let S;
try { S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch (e) { S = structuredClone(DEF); }
S.settings = Object.assign({}, DEF.settings, S.settings);
S.incomeHist = S.incomeHist || {}; S.credits = S.credits || []; S.catRules = S.catRules || {}; S.detailCards = S.detailCards || []; ['assets','debts','goals'].forEach(k=>S[k]=S[k]||[]); S.budgets=S.budgets||{}; S.prices=S.prices||{};
function migrate(){
  const cur = ym(new Date());
  S.recurring.forEach(r=>{ if(!r.start){ const p=(r.paid||[]).slice().sort(); r.start = p[0] && p[0]<cur ? p[0] : cur; } r.paidAmt = r.paidAmt||{}; });
  if(S.settings.income && !Object.keys(S.incomeHist).length) S.incomeHist[cur] = +S.settings.income;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Échec de l\'enregistrement : stockage désactivé'); } syncReminders(); }

/* ================== Hatırlatıcılar ==================
   Android'de: telefonun alarm/bildirim sistemine kurulur (uygulama kapalıyken de çalışır).
   Tarayıcıda: sayfa açıkken bildirim + ekranda uyarı. */
let lastReminderJson = null;
const REPEATS = [['','Pas de répétition'],['15m','Toutes les 15 minutes'],['30m','Toutes les 30 minutes'],['1h','Toutes les heures'],['3h','Toutes les 3 heures'],['1d','Tous les jours'],['1w','Toutes les semaines'],['1M','Tous les mois']];
const REPEAT_LABEL = {'15m':'toutes les 15 min','30m':'toutes les 30 min','1h':'toutes les heures','3h':'toutes les 3 h','1d':'tous les jours','1w':'chaque semaine','1M':'chaque mois'};
const FIXED_MS = {'15m':9e5,'30m':18e5,'1h':36e5,'3h':108e5};
/* k. tekrarın zamanı (k=0: ilk hatırlatma) */
function occAt(base, rep, k){
  if(FIXED_MS[rep]) return base + k*FIXED_MS[rep];
  const d = new Date(base);
  if(rep==='1d') d.setDate(d.getDate()+k);
  else if(rep==='1w') d.setDate(d.getDate()+7*k);
  else if(rep==='1M'){ const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+k); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  return +d;
}
function approxMs(rep){ return FIXED_MS[rep] || {'1d':864e5,'1w':6048e5,'1M':2592e6}[rep]; }
/* now'dan sonraki ilk hatırlatma (yoksa null) */
function nextOcc(t, now=Date.now()){
  const base = new Date(t.remind).getTime(); if(!isFinite(base)) return null;
  if(!t.repeat || !REPEAT_LABEL[t.repeat]) return base>now ? base : null;
  if(base>now) return base;
  let k = Math.max(0, Math.floor((now-base)/approxMs(t.repeat)) - 1);
  while(occAt(base,t.repeat,k)<=now) k++;
  return occAt(base,t.repeat,k);
}
/* now'a kadar gerçekleşmiş son hatırlatma (yoksa null) */
function lastOcc(t, now=Date.now()){
  const base = new Date(t.remind).getTime(); if(!isFinite(base) || base>now) return null;
  if(!t.repeat || !REPEAT_LABEL[t.repeat]) return base;
  let k = Math.max(0, Math.floor((now-base)/approxMs(t.repeat)) + 1);
  while(k>0 && occAt(base,t.repeat,k)>now) k--;
  return occAt(base,t.repeat,k);
}
function reminderList(){
  const now = Date.now();
  return S.todos.filter(t=>!t.done && t.remind).map(t=>({id:t.id, title:t.text, note:t.note||'', time:new Date(t.remind).getTime(), repeat:(REPEAT_LABEL[t.repeat]?t.repeat:'')}))
    .filter(r=>isFinite(r.time) && (r.repeat || r.time>now));
}
function syncReminders(){
  if(!(window.Android && Android.setReminders)) return;
  const j = JSON.stringify(reminderList());
  if(j===lastReminderJson) return;
  lastReminderJson = j;
  try { Android.setReminders(j); } catch(e){}
}
function browserReminderTick(){
  if(window.Android) return;
  const now = Date.now(); let changed=false;
  S.todos.forEach(t=>{
    if(t.done || !t.remind) return;
    if(t.notified===t.remind && t.lastFire==null) t.lastFire = new Date(t.remind).getTime();
    const tm = lastOcc(t, now);
    if(tm==null || (t.lastFire||0) >= tm) return;
    t.lastFire = tm; changed=true;
    if(now-tm < 6*36e5){
      toast('🔔 '+t.text);
      try { if('Notification' in window && Notification.permission==='granted'){ if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification('Rappel Mon Patrimoine',{body:t.text,icon:'icon-192.png'})).catch(()=>{}); else new Notification('Rappel Mon Patrimoine',{body:t.text}); } } catch(e){}
    }
  });
  if(changed){ save(); if(tab==='todo'||tab==='ozet') render(); }
}
const fmtDT = d => d.toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const CATS = ['Courses','Restaurants','Transport','Voiture','Factures','Assurances','Loyer','Abonnements','Santé','Vêtements','Loisirs','Éducation','Eda','Bali','Épargne','Autre'];
const tl = n => (isFinite(n)?n:0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const tl2 = n => (isFinite(n)?n:0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = (n,d=2) => (isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ================== Tarih yardımcıları ================== */
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const ym = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const thisYM = () => ym(new Date());
const monthDiff = (a,b) => { const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); };
const addMonths = (ymStr,k) => { const [y,m]=ymStr.split('-').map(Number); return ym(new Date(y,m-1+k,1)); };
const dueDate = (ymStr,day) => { const [y,m]=ymStr.split('-').map(Number); const last=new Date(y,m,0).getDate(); return new Date(y,m-1,Math.min(day,last)); };
const fmtDate = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const monthName = ymStr => { const [y,m]=ymStr.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); };
migrate();

/* Taksit: ay k (0..n-1) aktif mi? */
function instIndex(it, ymStr){ const k = monthDiff(it.start, ymStr); return (k>=0 && k<it.count) ? k : -1; }
const instMonthly = it => it.total/it.count;
const instPaidCount = it => (it.paid||[]).length;
const instRemaining = it => instMonthly(it) * Math.max(0, it.count - instPaidCount(it));

/* Düzenli ödeme o ay geçerli mi (eklendiği aydan, silindiği aya kadar) */
function recActive(r, ymStr){ return (!r.start || r.start<=ymStr) && (!r.end || ymStr<=r.end); }
const liveRecurring = () => S.recurring.filter(r=>!r.deleted);
function incomeFor(ymStr){ const ks=Object.keys(S.incomeHist).filter(k=>k<=ymStr).sort(); return ks.length? +S.incomeHist[ks[ks.length-1]] : 0; }
/* Bu ayın sabit yükleri */
function monthObligations(ymStr){
  const items = [];
  S.installments.forEach(it=>{ const k=instIndex(it,ymStr); if(k>=0) items.push({kind:'inst', ref:it, name:it.name, amount:instMonthly(it), day:it.day, sub:`Échéance ${k+1}/${it.count}`, paid:(it.paid||[]).includes(ymStr)}); });
  S.recurring.forEach(r=>{ if(!recActive(r,ymStr)) return; const paid=(r.paid||[]).includes(ymStr);
    items.push({kind:'rec', ref:r, name:r.name, amount: paid && r.paidAmt && r.paidAmt[ymStr]!=null ? +r.paidAmt[ymStr] : +r.amount, day:r.day, sub:r.category||'Paiement régulier', paid}); });
  return items.sort((a,b)=>a.day-b.day);
}
const varExp = ymStr => S.expenses.filter(e=>e.date.slice(0,7)===ymStr && !e.recId);
function monthSpent(ymStr){ return varExp(ymStr).reduce((s,e)=>s+ +e.amount,0); }
function avgVariable(){
  // son 3 ayın değişken harcama ortalaması (veri olan aylar)
  const cur = thisYM(); const vals=[];
  for(let k=0;k<3;k++){ const m=addMonths(cur,-k); const v=monthSpent(m); if(v>0||k===0) vals.push(v); }
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}

/* ================== UI çatı ================== */
const TABS = [
  {id:'ozet', name:'Résumé', icon:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>'},
  {id:'todo', name:'À faire', icon:'<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>'},
  {id:'harcama', name:'Dépenses', icon:'<path d="M21 7H3V5h18zm0 4H3v8h18zm-4 6h-3v-2h3z"/>'},
  {id:'odeme', name:'Paiements', icon:'<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/>'},
  {id:'patri', name:'Patrimoine', icon:'<path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM12 1 2 6v2h20V6z"/>'},
  {id:'rapor', name:'Rapports', icon:'<path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99z"/>'}
];
if(APP_CFG.focus==='patrimoine'){ const ord=['patri','ozet','harcama','odeme','rapor']; TABS.splice(0,TABS.length,...ord.map(id=>TABS.find(t=>t.id===id))); TABS[1].name='Résumé'; }
let tab = (location.hash||'').slice(1); if(!TABS.find(t=>t.id===tab)) tab=TABS[0].id;
let sub = { odeme:'taksit', harcama:'liste', todo:'acik' };

function renderNav(){
  $('#nav').innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===tab?'on':''}"><svg viewBox="0 0 24 24" fill="currentColor">${t.icon}</svg>${t.name}</button>`).join('');
}
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; try{history.replaceState(null,'','#'+tab);}catch(_){} render(); window.scrollTo(0,0); });

function render(){
  renderNav();
  const t = TABS.find(x=>x.id===tab);
  $('#title').textContent = t.id===TABS[0].id ? APP_CFG.name : t.name;
  $('#subtitle').textContent = monthName(thisYM());
  $('#fab').style.display = (tab==='ozet'||tab==='rapor') ? 'none' : '';
  ({ozet:vOzet, todo:vTodo, harcama:vHarcama, odeme:vOdeme, patri:vPatri, rapor:vRapor})[tab]();
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* Alt sayfa (form) */
function openSheet(html, onSubmit){
  $('#sheet').innerHTML = html; $('#sheetBg').classList.add('open');
  const f = $('#sheet form');
  if(f) f.addEventListener('submit',e=>{ e.preventDefault(); const data=Object.fromEntries(new FormData(f)); if(onSubmit(data)!==false){ closeSheet(); save(); render(); } });
  $('#sheet').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  const first=$('#sheet input:not([type=hidden]),#sheet select'); if(first) first.focus();
}
function closeSheet(){ $('#sheetBg').classList.remove('open'); }
$('#sheetBg').addEventListener('click',e=>{ if(e.target.id==='sheetBg') closeSheet(); });

function confirmSheet(msg, fn){
  openSheet(`<h3>${esc(msg)}</h3><div class="actions"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="cOk" style="background:var(--bad);color:#fff">Supprimer</button></div>`);
  $('#cOk').onclick=()=>{ fn(); closeSheet(); save(); render(); };
}

/* ================== ÖZET ================== */
function vOzet(){
  const m = thisYM(), inc = +S.settings.income||0;
  const obl = monthObligations(m);
  const oblTotal = obl.reduce((s,o)=>s+o.amount,0);
  const spent = monthSpent(m);
  const left = inc - oblTotal - spent;
  const openTodos = S.todos.filter(t=>!t.done);
  // kategori dağılımı
  const byCat = {}; varExp(m).forEach(e=>byCat[e.category]=(byCat[e.category]||0)+ +e.amount);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const maxC = cats[0]?.[1]||1;

  $('#view').innerHTML = `
  ${budgetAlert(m)}
  ${!inc?`<div class="tip w">Commence par saisir ton revenu net mensuel dans ⚙️ Réglages : le budget restant est calculé à partir de lui.</div>`:''}
  <div class="grid2" style="margin-top:6px">
    <div class="stat"><div class="l">Revenu mensuel</div><div class="v">${tl(inc)}</div></div>
    <div class="stat"><div class="l">Reste en fin de mois (estim.)</div><div class="v ${left<0?'neg':'pos'}">${tl(left)}</div></div>
    <div class="stat"><div class="l">Échéances + réguliers</div><div class="v">${tl(oblTotal)}</div></div>
    <div class="stat"><div class="l">Dépensé ce mois-ci</div><div class="v">${tl(spent)}</div></div>
  </div>
  ${APP_CFG.focus==='patrimoine'?wealthSummary(m):''}
  ${flowCard(m, 'Ce mois-ci')}
  ${budgetCard(m)}
  ${APP_CFG.focus==='patrimoine'?'':`  <div class="card"><h2>À faire <button class="btn sm ghost" data-go="todo">Tout voir</button></h2>
    ${openTodos.length? openTodos.slice(0,4).map(todoRow).join('') : '<div class="empty">Aucune tâche en cours</div>'}
  </div>`}
  <div class="card"><h2>Catégories ce mois-ci</h2>
    ${cats.length? cats.map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(c)}</span><span class="amt">${tl(v)}</span></div><div class="bar"><i style="width:${v/maxC*100}%"></i></div></div>`).join('') : '<div class="empty">Aucune dépense saisie ce mois-ci</div>'}
  </div>`;
  bindFlow();
  const be=$('#budEdit'); if(be) be.onclick=budgetForm;
  bindCommon();
}
function bindFlow(){ $('#view').querySelectorAll('#flowSeg button').forEach(b=>b.onclick=()=>{ flowMode=b.dataset.f; const y=window.scrollY; render(); window.scrollTo(0,y); }); }

function oblRow(o, ymStr, date){
  const d = date || dueDate(ymStr,o.day);
  return `<div class="row"><button class="chk ${o.paid?'on':''}" data-pay="${o.kind}:${o.ref.id}:${ymStr}">${o.paid?'✓':''}</button>
  <div class="grow"><div class="t">${esc(o.name)}</div><div class="s">${fmtDate(d)} · ${esc(o.sub)}</div></div><div class="amt">${tl(o.amount)}</div></div>`;
}
function togglePay(spec){
  const [kind,id,m] = spec.split(':');
  const list = kind==='inst'?S.installments:S.recurring; const it=list.find(x=>x.id===id); if(!it) return;
  it.paid = it.paid||[]; const i=it.paid.indexOf(m); if(i>=0) it.paid.splice(i,1); else it.paid.push(m);
  if(kind==='rec'){ it.paidAmt = it.paidAmt||{}; if(i>=0) delete it.paidAmt[m]; else it.paidAmt[m] = +it.amount; }
  save(); render(); toast(i>=0?'Paiement annulé':'Marqué comme payé');
}

function bindCommon(){
  $('#view').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>togglePay(b.dataset.pay));
  $('#view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ tab=b.dataset.go; render(); });
  $('#view').querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>{ const t=S.todos.find(x=>x.id===b.dataset.todo); t.done=!t.done; t.doneAt=t.done?Date.now():null; save(); render(); });
}

/* ================== YAPILACAKLAR ================== */
function todoRow(t){
  const pr = {h:'<span class="pill h">Haute</span>', m:'<span class="pill m">Moyenne</span>', l:''}[t.priority||'l'];
  let dueTxt=''; if(t.due){ const d=new Date(t.due+'T00:00'); const late=!t.done && d<today(); dueTxt=`<span class="${late?'neg':''}">${late?'En retard · ':''}${fmtDate(d)}</span>`; }
  if(t.remind && !t.done){ const nx=nextOcc(t); const r=new Date(nx??t.remind); const past=nx==null; const rp=REPEAT_LABEL[t.repeat];
    dueTxt += `${dueTxt?' · ':''}<span style="${past?'':'color:var(--pri)'}">🔔 ${fmtDT(r)}${rp?' · 🔁 '+rp:''}</span>`; }
  return `<div class="row ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" data-todo="${t.id}">${t.done?'✓':''}</button>
  <div class="grow" data-edit-todo="${t.id}"><div class="t">${esc(t.text)}</div><div class="s">${dueTxt}${t.note?(dueTxt?' · ':'')+esc(t.note):''}</div></div>${pr}
  <button class="icon" data-del-todo="${t.id}" aria-label="Supprimer">🗑</button></div>`;
}
function vTodo(){
  const list = S.todos.filter(t=> sub.todo==='acik'? !t.done : t.done)
    .sort((a,b)=> sub.todo==='acik' ? (({h:0,m:1,l:2}[a.priority||'l']-({h:0,m:1,l:2}[b.priority||'l'])) || (a.due||'9999').localeCompare(b.due||'9999')) : (b.doneAt||0)-(a.doneAt||0));
  $('#view').innerHTML = `
    <div class="seg"><button data-s="acik" class="${sub.todo==='acik'?'on':''}">En cours (${S.todos.filter(t=>!t.done).length})</button><button data-s="bitti" class="${sub.todo==='bitti'?'on':''}">Terminées (${S.todos.filter(t=>t.done).length})</button></div>
    <div class="card">${list.length?list.map(todoRow).join(''):`<div class="empty">${sub.todo==='acik'?'Rien à faire. Ajoute une tâche avec +.':'Aucune tâche terminée pour l\'instant.'}</div>`}</div>
    ${sub.todo==='bitti'&&list.length?'<button class="btn ghost" id="clrDone" style="width:100%">Effacer les tâches terminées</button>':''}`;
  $('#view').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ sub.todo=b.dataset.s; render(); });
  $('#view').querySelectorAll('[data-del-todo]').forEach(b=>b.onclick=()=>confirmSheet('Supprimer cette tâche ?',()=>S.todos=S.todos.filter(x=>x.id!==b.dataset.delTodo)));
  $('#view').querySelectorAll('[data-edit-todo]').forEach(b=>b.onclick=()=>todoForm(S.todos.find(x=>x.id===b.dataset.editTodo)));
  const c=$('#clrDone'); if(c) c.onclick=()=>confirmSheet('Supprimer toutes les tâches terminées ?',()=>S.todos=S.todos.filter(x=>!x.done));
  bindCommon();
}
function todoForm(t){
  t = t||{};
  openSheet(`<form><h3>${t.id?'Modifier la tâche':'Nouvelle tâche'}</h3>
    <label>Que faut-il faire ?</label><input name="text" required value="${esc(t.text||'')}" placeholder="Ex. Vérifier le relevé de carte bancaire">
    <div class="grid2"><div><label>Échéance</label><input type="date" name="due" value="${esc(t.due||'')}"></div>
    <div><label>Priorité</label><select name="priority">${[['l','Basse'],['m','Moyenne'],['h','Haute']].map(([v,n])=>`<option value="${v}" ${t.priority===v?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <label>🔔 Rappel (date et heure)</label>
    <div style="display:flex;gap:6px"><input type="datetime-local" name="remind" id="remIn" value="${esc(t.remind||'')}"><button type="button" class="btn ghost sm" id="remClr" aria-label="Supprimer le rappel">✕</button></div>
    <label>🔁 Répéter (jusqu'à ce que la tâche soit faite)</label>
    <select name="repeat">${REPEATS.map(([v,n])=>`<option value="${v}" ${(t.repeat||'')===v?'selected':''}>${n}</option>`).join('')}</select>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <button type="button" class="btn ghost sm" data-rq="60">Dans 1 heure</button>
      <button type="button" class="btn ghost sm" data-rq="tonight">Ce soir 20:00</button>
      <button type="button" class="btn ghost sm" data-rq="tomorrow">Demain 09:00</button>
      <button type="button" class="btn ghost sm" data-rq="due">À l'échéance 09:00</button></div>
    <label>Note</label><input name="note" value="${esc(t.note||'')}">
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
  d=>{
    if(!d.remind) d.repeat='';
    if(d.remind){ const tm=new Date(d.remind).getTime(); if(!isFinite(tm)) d.remind=''; else if(tm<=Date.now() && !d.repeat && d.remind!==t.remind){ toast('L\'heure du rappel est déjà passée'); return false; } }
    if(d.remind!==t.remind || d.repeat!==(t.repeat||'')){ delete t.notified; t.lastFire = Date.now(); }
    if(t.id) Object.assign(t,d); else S.todos.push({id:uid(),done:false,created:Date.now(),...d});
    if(d.remind){ const nx=nextOcc({remind:d.remind,repeat:d.repeat}); toast('🔔 '+(nx?fmtDT(new Date(nx)):fmtDT(new Date(d.remind)))+(REPEAT_LABEL[d.repeat]?' · répété '+REPEAT_LABEL[d.repeat]:''));
      if(!window.Android){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){} } }
  });
  const pad=n=>String(n).padStart(2,'0');
  const toLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('#remClr').onclick=()=>{ $('#remIn').value=''; };
  $('#sheet').querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.rq; let d=new Date(); d.setSeconds(0,0);
    if(q==='60') d=new Date(+d+60*6e4);
    else if(q==='tonight'){ d.setHours(20,0); if(d<new Date()) d.setDate(d.getDate()+1); }
    else if(q==='tomorrow'){ d.setDate(d.getDate()+1); d.setHours(9,0); }
    else if(q==='due'){ const due=$('#sheet input[name=due]').value; if(!due){ toast('Choisis d\'abord l\'échéance'); return; } d=new Date(due+'T09:00'); if(d<new Date()){ toast('L\'échéance est déjà passée'); return; } }
    $('#remIn').value=toLocal(d);
  });
}

/* ================== HARCAMALAR ================== */
let expMonth = thisYM();
function vHarcama(){
  const list = S.expenses.filter(e=>e.date.slice(0,7)===expMonth).sort((a,b)=>b.date.localeCompare(a.date));
  const total = list.filter(e=>!e.recId).reduce((s,e)=>s+ +e.amount,0);
  const groups = {}; list.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  $('#view').innerHTML = `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <button class="icon" id="pm">‹</button>
      <div style="text-align:center"><div style="font-weight:600">${monthName(expMonth)}</div><div class="amt" style="font-size:20px">${tl2(total)}</div></div>
      <button class="icon" id="nm">›</button></div>
    <button class="btn ghost" id="impBtn" style="width:100%">📥 Importer des relevés bancaires (PDF ou CSV)</button>
    ${list.length? Object.entries(groups).map(([d,arr])=>`<div class="card"><h2><span>${new Date(d+'T00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span><span class="amt">${tl2(arr.filter(e=>!e.recId).reduce((s,e)=>s+ +e.amount,0))}</span></h2>
      ${arr.map(e=>`<div class="row"><div class="grow" data-edit-exp="${e.id}"><div class="t">${esc(e.note||e.category)}</div><div class="s">${e.recId?'🔁 Paiement régulier · ':''}${esc(e.category)}</div></div><div class="amt" style="${e.recId?'color:var(--mute)':e.amount<0?'color:var(--ok)':''}">${e.amount<0?'+'+tl2(-e.amount):tl2(+e.amount)}</div><button class="icon" data-del-exp="${e.id}">🗑</button></div>`).join('')}</div>`).join('')
    : '<div class="card"><div class="empty">Aucune dépense ce mois-ci. Ajoute-en avec +.</div></div>'}`;
  $('#impBtn').onclick=pickFiles;
  $('#pm').onclick=()=>{ expMonth=addMonths(expMonth,-1); render(); };
  $('#nm').onclick=()=>{ expMonth=addMonths(expMonth,1); render(); };
  $('#view').querySelectorAll('[data-del-exp]').forEach(b=>b.onclick=()=>confirmSheet('Supprimer cette dépense ?',()=>S.expenses=S.expenses.filter(x=>x.id!==b.dataset.delExp)));
  $('#view').querySelectorAll('[data-edit-exp]').forEach(b=>b.onclick=()=>expForm(S.expenses.find(x=>x.id===b.dataset.editExp)));
}
function expForm(e){
  e = e||{date:new Date().toISOString().slice(0,10), category:'Courses'};
  openSheet(`<form><h3>${e.id?'Modifier la dépense':'Nouvelle dépense'}</h3>
    <label>${e.refund?'Montant reçu (€) · déduit de la catégorie':'Montant (€)'}</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(e.refund?-e.amount:(e.amount||''))}">
    <div class="grid2"><div><label>Date</label><input type="date" name="date" required value="${esc(e.date)}"></div>
    <div><label>Catégorie</label><select name="category">${CATS.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <label>Description</label><input name="note" value="${esc(e.note||'')}" placeholder="Ex. Courses de la semaine">
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
  d=>{ d.amount=e.refund ? -Math.abs(+d.amount) : +d.amount; const old=e.category;
    if(e.id) Object.assign(e,d); else S.expenses.push({id:uid(),...d}); expMonth=d.date.slice(0,7);
    if(e.id && e.key && old!==d.category){ S.catRules[e.key]=d.category; let n=0; S.expenses.forEach(x=>{ if(x!==e && x.key===e.key && x.category!==d.category){ x.category=d.category; n++; } }); if(n) setTimeout(()=>toast('Catégorie appliquée aussi à '+n+' opération'+(n>1?'s':'')+' semblable'+(n>1?'s':'')),50); } });
}

/* ================== ÖDEMELER (taksit + düzenli) ================== */
function vOdeme(){
  const m = thisYM();
  let body='';
  if(sub.odeme==='taksit'){
    const active = S.installments.filter(it=>instPaidCount(it)<it.count);
    const finished = S.installments.filter(it=>instPaidCount(it)>=it.count);
    const totalRemain = S.installments.reduce((s,it)=>s+instRemaining(it),0);
    const monthly = S.installments.filter(it=>instIndex(it,m)>=0).reduce((s,it)=>s+instMonthly(it),0);
    body = `<div class="grid2"><div class="stat"><div class="l">Échéances ce mois-ci</div><div class="v">${tl(monthly)}</div></div><div class="stat"><div class="l">Reste à payer (total)</div><div class="v">${tl(totalRemain)}</div></div></div>
    <div class="card">${active.length? active.map(it=>{
      const pc=instPaidCount(it), k=instIndex(it,m), end=addMonths(it.start,it.count-1);
      const paidNow=(it.paid||[]).includes(m);
      return `<div class="row" style="flex-wrap:wrap">
        ${k>=0?`<button class="chk ${paidNow?'on':''}" data-pay="inst:${it.id}:${m}">${paidNow?'✓':''}</button>`:'<span style="width:24px"></span>'}
        <div class="grow" data-edit-inst="${it.id}"><div class="t">${esc(it.name)}</div><div class="s">${tl(instMonthly(it))}/mois · le ${it.day} du mois · fin ${monthName(end)}</div>
        <div class="bar"><i style="width:${pc/it.count*100}%"></i></div><div class="s">${pc}/${it.count} payées · reste ${tl(instRemaining(it))}</div></div>
        <button class="icon" data-del-inst="${it.id}">🗑</button></div>`;}).join('') : '<div class="empty">Aucun paiement échelonné en cours. Ajoute-en avec +.</div>'}</div>
    ${finished.length?`<div class="card"><h2>Paiements échelonnés terminés</h2>${finished.map(it=>`<div class="row"><div class="grow"><div class="t">${esc(it.name)}</div><div class="s">${tl(it.total)} · ${it.count} échéances</div></div><button class="icon" data-del-inst="${it.id}">🗑</button></div>`).join('')}</div>`:''}`;
  } else if(sub.odeme==='abos'){
    body = abosBody();
  } else {
    const total = liveRecurring().reduce((s,r)=>s+ +r.amount,0);
    body = `<div class="stat"><div class="l">Paiements réguliers mensuels</div><div class="v">${tl(total)}</div></div>
    ${S.expenses.some(e=>e.src==='import')?'<button class="btn ghost" id="detBtn" style="width:100%;margin-top:10px">🔍 Détecter dans les relevés importés</button>':''}
    <div class="card">${liveRecurring().length? liveRecurring().sort((a,b)=>a.day-b.day).map(r=>{ const p=(r.paid||[]).includes(m);
      return `<div class="row"><button class="chk ${p?'on':''}" data-pay="rec:${r.id}:${m}">${p?'✓':''}</button>
      <div class="grow" data-edit-rec="${r.id}"><div class="t">${esc(r.name)}</div><div class="s">Le ${r.day} du mois · ${esc(r.category)}</div></div><div class="amt">${tl(+r.amount)}</div><button class="icon" data-del-rec="${r.id}">🗑</button></div>`;}).join('') : '<div class="empty">Ajoute avec + les paiements qui reviennent chaque mois : loyer, factures, abonnements…</div>'}</div>`;
  }
  $('#view').innerHTML = `<div class="seg"><button data-s="taksit" class="${sub.odeme==='taksit'?'on':''}">Échelonnés</button><button data-s="duzenli" class="${sub.odeme==='duzenli'?'on':''}">Réguliers</button><button data-s="abos" class="${sub.odeme==='abos'?'on':''}">Abonnements</button></div>${body}`;
  $('#view').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ sub.odeme=b.dataset.s; render(); });
  const det=$('#detBtn'); if(det) det.onclick=()=>openDetect(false);
  $('#view').querySelectorAll('[data-del-inst]').forEach(b=>b.onclick=()=>confirmSheet('Supprimer ce paiement échelonné ?',()=>S.installments=S.installments.filter(x=>x.id!==b.dataset.delInst)));
  $('#view').querySelectorAll('[data-del-rec]').forEach(b=>b.onclick=()=>confirmSheet('Supprimer ce paiement régulier ? (Il reste dans les rapports des mois passés)',()=>deleteRec(b.dataset.delRec)));
  $('#view').querySelectorAll('[data-edit-inst]').forEach(b=>b.onclick=()=>instForm(S.installments.find(x=>x.id===b.dataset.editInst)));
  $('#view').querySelectorAll('[data-edit-rec]').forEach(b=>b.onclick=()=>recForm(S.recurring.find(x=>x.id===b.dataset.editRec)));
  bindCommon();
}
function instForm(it){
  it = it||{start:thisYM(), day:1, count:6};
  const pc = it.id? instPaidCount(it) : 0;
  openSheet(`<form><h3>${it.id?'Modifier le paiement échelonné':'Nouveau paiement échelonné'}</h3>
    <label>Pour quoi ?</label><input name="name" required value="${esc(it.name||'')}" placeholder="Ex. Téléphone, frigo">
    <div class="grid2"><div><label>Montant total (€)</label><input name="total" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(it.total||'')}"></div>
    <div><label>Nombre d'échéances</label><input name="count" type="number" min="1" max="120" required value="${esc(it.count)}"></div></div>
    <div class="grid2"><div><label>Mois de la 1re échéance</label><input name="start" type="month" required value="${esc(it.start)}"></div>
    <div><label>Jour de paiement</label><input name="day" type="number" min="1" max="31" required value="${esc(it.day)}"></div></div>
    <label>Échéances déjà payées</label><input name="paidCount" type="number" min="0" value="${pc}">
    <p class="note">Mensualité = total ÷ nombre d'échéances. Si le paiement a commencé avant ce mois-ci, indique combien d'échéances sont déjà payées.</p>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
  d=>{
    const obj = {name:d.name,total:+d.total,count:Math.max(1,parseInt(d.count)),start:d.start,day:parseInt(d.day)};
    const n = Math.min(obj.count, Math.max(0, parseInt(d.paidCount)||0));
    const paid = Array.from({length:n},(_,k)=>addMonths(obj.start,k));
    if(it.id) Object.assign(it,obj,{paid}); else S.installments.push({id:uid(),...obj,paid});
  });
}
function deleteRec(id){
  const r=S.recurring.find(x=>x.id===id); if(!r) return; const m=thisYM();
  const end = (r.paid||[]).includes(m) ? m : addMonths(m,-1);
  if(!r.start || r.start>end){ S.recurring=S.recurring.filter(x=>x.id!==id); S.expenses.forEach(e=>{ if(e.recId===id) delete e.recId; }); }
  else { r.end=end; r.deleted=true; S.expenses.forEach(e=>{ if(e.recId===id && e.date.slice(0,7)>end) delete e.recId; }); }
  if(r.match) S.catRules['__ignore_'+r.match+(r.matchAmt?'#'+Math.round(r.matchAmt):'')]=1;
}
function recForm(r){
  r = r||{day:1, category:'Factures'};
  openSheet(`<form><h3>${r.id?'Modifier le paiement régulier':'Nouveau paiement régulier'}</h3>
    <label>Nom</label><input name="name" required value="${esc(r.name||'')}" placeholder="Ex. Loyer, internet, Netflix">
    <div class="grid2"><div><label>Montant mensuel (€)</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(r.amount||'')}"></div>
    <div><label>Jour de paiement</label><input name="day" type="number" min="1" max="31" required value="${esc(r.day)}"></div></div>

function monthReport(m){
  const obl = monthObligations(m);
  const inst = obl.filter(o=>o.kind==='inst'), rec = obl.filter(o=>o.kind==='rec');
  const exps = varExp(m);
  const byCat = {}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+ +e.amount);
  const spent = exps.reduce((s,e)=>s+ +e.amount,0);
  const instT = inst.reduce((s,o)=>s+o.amount,0), recT = rec.reduce((s,o)=>s+o.amount,0);
  const unpaid = obl.filter(o=>!o.paid).length;
  return {m, inc:incomeFor(m), spent, instT, recT, total:spent+instT+recT, byCat, obl, unpaid, count:exps.length};
}
function historyMonths(){
  const cur=thisYM(); const starts=[cur];
  S.expenses.forEach(e=>starts.push(e.date.slice(0,7)));
  S.installments.forEach(i=>starts.push(i.start));
  S.recurring.forEach(r=>r.start&&starts.push(r.start));
  Object.keys(S.incomeHist).forEach(k=>starts.push(k));
  let first = starts.filter(x=>x<=cur).sort()[0];
  if(monthDiff(first,cur)>35) first = addMonths(cur,-35);
  const out=[]; for(let m=cur; m>=first; m=addMonths(m,-1)) out.push(m);
  return out;
}
/* En büyük 6 dilim + "Diğer": 8. renk asla üretilmez, kuyruk toplanır */
function toSlices(pairs){
  const arr = pairs.filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const top = arr.length>7 ? arr.slice(0,6) : arr;
  const rest = arr.length>7 ? arr.slice(6).reduce((s,p)=>s+p[1],0) : 0;
  const sl = top.map((p,i)=>({name:p[0], value:p[1], color:COLORS[i]}));
  if(rest>0) sl.push({name:'Autres', value:rest, color:OTHER});
  return sl;
}
function arcPath(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.sin(a), cy-r*Math.cos(a)];
  const large = a1-a0>Math.PI?1:0;
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0}A${r1},${r1} 0 ${large} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${large} 0 ${x3},${y3}Z`;
}
function pieChart(id, title, slices){

    if(frac>=0.9999) paths += `<path d="${arcPath(cx,cy,r0,r1,0,Math.PI*1.9999)}" fill="${s.color}" data-pie="${id}:${i}"${dim}><title>${label}</title></path>`;
    else paths += `<path d="${arcPath(cx,cy,r0,r1,a,a1)}" fill="${s.color}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" data-pie="${id}:${i}"${dim}><title>${label}</title></path>`;
    a=a1;

  const center = cs

/* -- analyse des formats -- */
function parseAmt(v){
  if(v==null) return NaN;
  let s = String(v).replace(/[\s  €$£]|EUR/gi,'').trim();
  if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(/-$/.test(s)){ neg=true; s=s.slice(0,-1); }
  if(/^\+/.test(s)) s=s.slice(1);
  if(/^-/.test(s)){ neg=!neg; s=s.slice(1); }
  if(!/^[\d.,']+$/.test(s)) return NaN;
  s = s.replace(/'/g,'');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc>=0 && ld>=0){ s = lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(lc>=0){ s = (s.split(',').length>2) ? s.replace(/,/g,'') : s.replace(',','.'); }
  else if(ld>=0 && s.split('.').length>2) s = s.replace(/\./g,'');
  const n = parseFloat(s); if(!isFinite(n)) return NaN;
  return neg ? -n : n;
}
function parseDate(v){
  const s = String(v||'').trim(); let m;
  const ok = (y,mo,d)=>{ y=+y; mo=+mo; d=+d; if(y<100) y+=2000; if(mo<1||mo>12||d<1||d>31||y<1990||y>2100) return null; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ok(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))) return ok(m[3],m[2],m[1]);
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/))) return ok(m[1],m[2],m[3]);
  return null;
}
function csvRows(t, d){

    else if(c==='"' && f.trim()==='') { q=true; f=''; }
    else if(c===d){ row.push(f); f=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const hnorm = s => stripAcc(s).toLowerCase().trim();
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()).slice(0,40);
  const share = ch => lines.filter(l=>l.includes(ch)).length / Math.max(1,lines.length);
  const d = share(';')>=0.5 ? ';' : share('\t')>=0.5 ? '\t' : ',';
  const rows = csvRows(text, d);
  // en-tête
  let hi=-1, best=0;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const h=rows[i].map(hnorm); let sc=0;
    if(h.some(x=>/date/.test(x))) sc++;
    if(h.some(x=>/libell|label|description|payee|benefic|detail|memo|intitul|wording|nom\b|motif|tiers/.test(x))) sc++;
    if(h.some(x=>/montant|amount|debit|credit|somme/.test(x))) sc++;
    if(sc>best && h.every(x=>!parseDate(x))){ best=sc; hi=i; }
  }
  let di=-1, ai=-1, dbi=-1, cri=-1, li=-1, data;
  const avgLen = (idx, rs) => rs.reduce((s,r)=>s+String(r[idx]||'').trim().length,0)/Math.max(1,rs.length);
  if(best>=2){
    const h = rows[hi].map(hnorm); data = rows.slice(hi+1);
    const dates = h.map((x,i)=>/date/.test(x)?i:-1).filter(i=>i>=0);
    di = dates.find(i=>/op|start|transac|compta|effet/.test(h[i]) && !/valeur|value/.test(h[i])) ?? dates.find(i=>!/valeur|value/.test(h[i])) ?? dates[0] ?? -1;
    ai = h.findIndex(x=>/montant|amount|somme/.test(x) && !/solde|balance|frais|fee|devise|currency|foreign|origin|etrang/.test(x));
    dbi = h.findIndex(x=>/debit/.test(x)); cri = h.findIndex(x=>/credit/.test(x));
    const lc = h.map((x,i)=>/libell|label|description|payee|benefic|detail|memo|intitul|wording|nom\b|motif|tiers|partenaire|reference/.test(x) && !/date|montant|amount|categor|numero|devise|solde|compte|account/.test(x) ? i : -1).filter(i=>i>=0);
    li = lc.sort((a,b)=>avgLen(b,data)-avgLen(a,data))[0] ?? -1;
  }
  if(di<0 || (ai<0 && dbi<0 && cri<0)){
    // pas d'en-tête reconnu : on devine les colonnes
    data = rows.filter(r=>r.length>=3);
    const n = Math.max(...data.map(r=>r.length));
    const rate = (i,fn)=>data.filter(r=>fn(r[i])).length/Math.max(1,data.length);
    let bd=0; for(let i=0;i<n;i++){ const r=rate(i,x=>parseDate(x)); if(r>bd){ bd=r; di=i; } }
    if(bd<0.5) return [];
    let ba=0; for(let i=0;i<n;i++){ if(i===di) continue; const r=rate(i,x=>/[,.]\d{2}\s*$/.test(String(x).trim()) && isFinite(parseAmt(x))); const neg=rate(i,x=>parseAmt(x)<0); const sc=r+(neg>0?0.5:0); if(r>=0.5 && sc>ba){ ba=sc; ai=i; } }
    if(ai<0) return [];
    let bl=0; for(let i=0;i<n;i++){ if(i===di||i===ai) continue; const L=avgLen(i,data); if(L>bl && rate(i,x=>isFinite(parseAmt(x)))<0.5){ bl=L; li=i; } }
  }
  const out=[];
  data.forEach(r=>{
    const date = parseDate(r[di]); if(!date) return;
    let amount;
    if(ai>=0 && String(r[ai]||'').trim()!=='') amount = parseAmt(r[ai]);
    else { const db=parseAmt(r[dbi]), cr=parseAmt(r[cri]); amount = (isFinite(cr)?Math.abs(cr):0) - (isFinite(db)?Math.abs(db):0); }
    if(!isFinite(amount) || !amount) return;
    const label = String(li>=0 ? r[li] : '').replace(/\s+/g,' ').trim();
    out.push({date, amount:Math.round(amount*100)/100, label});
  });
  return out;
}
function parseOFX(text){
  return text.split(/<STMTTRN>/i).slice(1).map(b=>{
    const g = t => { const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
    const name=g('NAME'), memo=g('MEMO');
    return {date:parseDate(g('DTPOSTED')), amount:parseAmt(g('TRNAMT')), label:(name && memo && !memo.includes(name) ? name+' '+memo : name||memo)};
  }).filter(t=>t.date && isFinite(t.amount) && t.amount);
}
function parseQIF(text){
  return text.split(/^\^\s*$/m).map(b=>{
    const t={label:''}; b.split(/\r?\n/).forEach(l=>{ const k=l[0], v=l.slice(1).trim();
      if(k==='D') t.date=parseDate(v.replace("'",'/')); else if(k==='T'||k==='U') t.amount=parseAmt(v); else if(k==='P') t.label=v+(t.label?' '+t.label:''); else if(k==='M') t.label=(t.label?t.label+' ':'')+v; });
    return t;
  }).filter(t=>t.date && isFinite(t.amount) && t.amount);
}
async function readText(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,''); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function detectLoans(all){
  const num2 = s => parseAmt(String(s).replace(/\s/g,''));
  const g={};
  all.forEach(t=>{ const L=stripAcc(t.label).toUpperCase(); const m=L.match(/CAPITAL RESTANT\s*:?\s*([\d .,]+\d)/); if(!m) return;
    const k=txKey(t.label.split(' - ')[0]); if(!g[k] || g[k].date<t.date) g[k]={date:t.date, restant:num2(m[1]), cap:num2((L.match(/CAPITAL AMORTI\s*:?\s*([\d .,]+\d)/)||[])[1]), int:num2((L.match(/INTERETS\s*:?\s*([\d .,]+\d)/)||[])[1]), amount:Math.abs(t.amount)}; });
  let last=0;
  Object.entries(g).forEach(([k,x])=>{ if(!isFinite(x.restant)) return;
    const pay = isFinite(x.cap)&&isFinite(x.int) ? Math.round((x.cap+x.int)*100)/100 : x.amount;
    const rate = isFinite(x.cap)&&isFinite(x.int) ? Math.round(x.int/(x.restant+x.cap)*1200*1000)/1000 : 0;
    let d = S.debts.find(d=>d.match===k);
    if(!d){ d={id:uid(), name:'Prêt immobilier', kind:'immo', match:k}; S.debts.push(d); }
    if(!d.ref || x.date.slice(0,7)>=d.ref){ Object.assign(d,{balance:x.restant, ref:x.date.slice(0,7), payment:pay, rate}); }
    last=x.restant;
  });
  return last;
}
const txHash = t => t.date+'|'+t.amount.toFixed(2);

async function importFiles(files){
  let all=[], bad=[], perFile=[], checks=[], newCards=new Set();
  const pdfs = files.filter(f=>/\.pdf$/i.test(f.name) || f.type==='application/pdf');
  let P=null;
  if(pdfs.length){
    toast('Lecture de '+pdfs.length+' PDF…');
    try{ const lib = await import('./pdf.min.mjs'); lib.GlobalWorkerOptions.workerSrc = new URL('./pdf.worker.min.mjs', location.href).href; P = {lib, ...(await import('./pdfimport.mjs'))}; }
    catch(e){ P=null; }
  }
  for(const f of files){
    if(pdfs.includes(f)){
      try{
        if(!P) throw new Error('pdf');
        const r = P.parseStatement(await P.extractPages(P.lib, new Uint8Array(await f.arrayBuffer())));
        if(r.check) checks.push({name:f.name, ...r.check});
        if(r.card) newCards.add(r.card);
        if(r.tx.length){ all=all.concat(r.tx); perFile.push(r.tx); } else bad.push(f.name);
      }catch(e){ bad.push(f.name); }
      continue;
    }
    try{
      const t = await readText(f);
      const tx = /<STMTTRN>/i.test(t) ? parseOFX(t) : /^!Type:/mi.test(t) ? parseQIF(t) : parseCSV(t);
      if(tx.length){ all=all.concat(tx); perFile.push(tx); } else bad.push(f.name);
    }catch(e){ bad.push(f.name); }
  }
  if(!all.length){
    openSheet(`<h3>Format non reconnu</h3><p>Je n'ai trouvé aucune opération dans ${bad.length>1?'ces fichiers':'ce fichier'}.</p>

    const isDeb = t => t.cardDebit ? S.detailCards.includes(t.cardDebit) : false;
    perFile = perFile.map(tx=>tx.filter(t=>!isDeb(t))); all = all.filter(t=>!isDeb(t));
    S.expenses = S.expenses.filter(e=>{ const m=(e.label||'').match(/DEBIT MENSUEL CARTE.*X(\d{4})/); return !(m && S.detailCards.includes(m[1])); });
  }
  const loans = detectLoans(all);
  // doublons : comparés aux opérations déjà présentes et aux fichiers précédents du même import
  const known = {}; [...S.expenses, ...S.credits].forEach(x=>{ if(x.h) known[x.h]=(known[x.h]||0)+1; });
  const fresh=[]; let dup=0;
  perFile.forEach(tx=>{
    const avail = {...known}, cnt = {};
    tx.forEach(t=>{ const h=txHash(t); if(avail[h]>0){ avail[h]--; dup++; } else { fresh.push({...t,h}); cnt[h]=(cnt[h]||0)+1; } });
    Object.entries(cnt).forEach(([h,c])=>known[h]=(known[h]||0)+c);
  });
  const deb=fresh.filter(t=>t.amount<0), cre=fresh.filter(t=>t.amount>0);
  const ds=fresh.map(t=>t.date).sort();
  if(loans){ save(); if(!fresh.length){ render(); toast('Prêt mis à jour : capital restant '+tl(loans)); } }
  openSheet(`<form><h3>Importer les relevés</h3>
    ${fresh.length?`<table>
      <tr><td>Période</td><td>${ds.length?fmtDate(new Date(ds[0]+'T00:00'))+' → '+new Date(ds[ds.length-1]+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):''}</td></tr>
      <tr><td>Dépenses</td><td>${deb.length} · ${tl(deb.reduce((s,t)=>s-t.amount,0))}</td></tr>
      <tr><td>Rentrées d'argent</td><td>${cre.length} · ${tl(cre.reduce((s,t)=>s+t.amount,0))}</td></tr>
      ${dup?`<tr><td>Déjà importées (ignorées)</td><td>${dup}</td></tr>`:''}
    </table>
    <p class="note">Les dépenses sont classées automatiquement par catégorie. Tu pourras corriger une catégorie : la correction s'appliquera aussi aux opérations semblables.</p>`
    :`<p>Toutes ces opérations (${dup}) sont déjà dans l'application.</p>`}
    ${checks.length?(checks.every(c=>c.ok)?`<p class="note pos">✅ ${checks.length} relevé${checks.length>1?'s':''} PDF vérifié${checks.length>1?'s':''} : les totaux correspondent à ceux de la banque.</p>`
      :`<p class="note neg">⚠️ Totaux différents pour : ${esc(checks.filter(c=>!c.ok).map(c=>c.name).join(', '))}. Certaines opérations ont pu être mal lues, vérifie-les.</p>`):''}
    ${bad.length?`<p class="note">Fichier(s) non reconnu(s) : ${esc(bad.join(', '))}</p>`:''}
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button>${fresh.length?'<button class="btn">Importer</button>':''}</div></form>`,
  ()=>{
    fresh.forEach(t=>{
      const key = txKey(t.label);
      if(t.amount<0) S.expenses.push({id:uid(), date:t.date, amount:-t.amount, category:guessCat(t.label,key), note:prettyKey(key)||t.label||'Opération', label:t.label, key, h:t.h, src:'import'});
      else if(isRefund(t.label)) S.expenses.push({id:uid(), date:t.date, amount:-t.amount, category:guessCat(t.label,key), note:prettyKey(key)||t.label, label:t.label, key, h:t.h, src:'import', refund:true});
      else S.credits.push({id:uid(), date:t.date, amount:t.amount, label:t.label, key, h:t.h});
    });
    autoLink();
    if(ds.length) expMonth = ds[ds.length-1].slice(0,7);
    toast(fresh.length+' opérations importées');
    setTimeout(()=>openDetect(true), 300);
  });
}

/* -- détection des paiements réguliers -- */
const median = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return n? (n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : 0; };
function importedMonths(){ return [...new Set([...S.expenses.filter(e=>e.src==='import'), ...S.credits].map(x=>x.date.slice(0,7)))].sort(); }
function recurringGroups(list, minAmt){
  const nM = importedMonths().length, minM = nM>=4 ? 3 : 2;
  const g={}; list.forEach(x=>{ if(x.key) (g[x.key]=g[x.key]||[]).push(x); });
  const out=[];
  const clusters=[];
  Object.entries(g).forEach(([key,arr])=>{
    const nm=new Set(arr.map(x=>x.date.slice(0,7))).size;
    if(arr.length<=nm*1.5){ clusters.push([key,arr,null]); return; }
    if(arr.length>nm*3) return;
    // plusieurs prélèvements par mois chez le même organisme : on sépare par montant
    const srt=[...arr].sort((a,b)=>a.amount-b.amount); let cur=[srt[0]];
    for(let i=1;i<srt.length;i++){ const prev=cur[cur.length-1]; if(srt[i].amount-prev.amount <= Math.max(0.5, prev.amount*0.03)) cur.push(srt[i]); else { clusters.push([key,cur,1]); cur=[srt[i]]; } }
    clusters.push([key,cur,1]);
  });
  const lastData = importedMonths().slice(-1)[0];
  clusters.forEach(([key,arr,split])=>{
    const months=[...new Set(arr.map(x=>x.date.slice(0,7)))].sort();
    if(months.length<minM || arr.length>months.length*(split?1:1.5)) return;
    // encore actif (vu dans les 2 derniers mois) et régulier (au moins 70 % des mois entre le premier et le dernier)
    if(lastData && months[months.length-1] < addMonths(lastData,-2)) return;
    if(months.length < 0.7*(monthDiff(months[0],months[months.length-1])+1)) return;
    const am=arr.map(x=>+x.amount), med=median(am);
    if(med<(minAmt||1)) return;
    if(am.filter(a=>Math.abs(a-med)<=Math.max(2,med*0.25)).length < arr.length*0.75) return;
    const recent=[...arr].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(x=>+x.amount);
    const cats={}; arr.forEach(x=>cats[x.category]=(cats[x.category]||0)+1);
    out.push({key, split:!!split, name:prettyKey(key)+(split?' '+tl2(median(am)):''), amount:Math.round(median(recent)*100)/100, day:Math.round(median(arr.map(x=>+x.date.slice(8,10)))), months, category:Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Autre', n:arr.length});
  });
  return out.sort((a,b)=>b.amount-a.amount);
}
function detectRecurring(){
  return recurringGroups(S.expenses.filter(e=>e.src==='import' && !e.recId), 1).filter(c=>!S.recurring.some(r=>matches(r,c.key,c.amount)) && !S.catRules['__ignore_'+c.key+(c.split?'#'+Math.round(c.amount):'')]);
}
function detectIncome(){
  const g = recurringGroups(S.credits, 300); if(!g.length) return null;
  return {amount:Math.round(g.reduce((s,x)=>s+x.amount,0)*100)/100, name:g.map(x=>x.name+' '+tl(x.amount)).join(' + '), months:[g.map(x=>x.months[0]).sort()[0]], n:Math.max(...g.map(x=>x.months.length))};
}
const matches = (r,key,amount) => r.match===key && (!r.matchAmt || Math.abs(amount-r.matchAmt) <= Math.max(0.5, r.matchAmt*0.04));
function autoLink(){
  S.recurring.forEach(r=>{
    if(!r.match) return;
    const byM={};
    S.expenses.forEach(e=>{ if(matches(r,e.key,+e.amount) && (!e.recId || e.recId===r.id)){ e.recId=r.id; const m=e.date.slice(0,7); byM[m]=(byM[m]||0)+ +e.amount; } });
    r.paid=r.paid||[]; r.paidAmt=r.paidAmt||{};
    Object.entries(byM).forEach(([m,v])=>{ if(!r.paid.includes(m)) r.paid.push(m); r.paidAmt[m]=Math.round(v*100)/100; if(!r.start||m<r.start) r.start=m; });
  });
}

/* ================== GRAPHIQUE DE FLUX ================== */
const GROUPS = [['Épargne','var(--c7)'],['Logement','var(--c2)'],['Voiture','var(--c5)'],['Assurances','var(--c6)'],['Échéances','var(--c4)'],['Vie quotidienne','var(--c1)'],['Abonnements','var(--c3)'],['Non dépensé','var(--c8)']];
const catGroup = c => ({Loyer:'Logement',Factures:'Logement',Abonnements:'Abonnements','Épargne':'Épargne',Voiture:'Voiture',Assurances:'Assurances'})[c] || 'Vie quotidienne';
let flowMode = null;
function avgMonths(){
  const cur=thisYM(), has = m => S.expenses.some(e=>e.date.slice(0,7)===m) || S.credits.some(c=>c.date.slice(0,7)===m);
  const ms=[]; for(let k=1;k<=6;k++){ const m=addMonths(cur,-k); if(has(m)) ms.push(m); }
  return ms.length? ms.reverse() : [cur];
}
const creditsIn = m => S.credits.filter(c=>c.date.slice(0,7)===m).reduce((s,c)=>s+ +c.amount,0);
function flowData(months){
  const L={}; let inc=0;
  const add=(g,name,v)=>{ if(!v) return; const k=g+'|'+name; (L[k]=L[k]||{g,name,value:0}).value+=v; };
  months.forEach(m=>{
    inc += incomeFor(m) || creditsIn(m);
    monthObligations(m).forEach(o=>add(o.kind==='inst'?'Échéances':catGroup(o.ref.category), o.name, o.amount));
    varExp(m).forEach(e=>add(catGroup(e.category), e.category, +e.amount));
  });
  const n=months.length; Object.values(L).forEach(l=>l.value/=n);
  return {inc:inc/n, leaves:Object.values(L).filter(l=>l.value>0.005)};
}
function sankeySVG(fd){
  const W=360, gO=GROUPS.map(g=>g[0]);
  let leaves = fd.leaves.slice().sort((a,b)=>(gO.indexOf(a.g)-gO.indexOf(b.g)) || b.value-a.value);
  if(leaves.length>30){ const out=[]; gO.forEach(g=>{ const ls=leaves.filter(l=>l.g===g); if(ls.length<=8) out.push(...ls); else { out.push(...ls.slice(0,7)); out.push({g,name:'Autres',value:ls.slice(7).reduce((s,l)=>s+l.value,0)}); } }); leaves=out; }
  const spent = leaves.reduce((s,l)=>s+l.value,0);
  if(!spent && !fd.inc) return '<div class="empty">Aucune donnée pour cette période</div>';
  const groups = GROUPS.map(([g,col])=>({g,col,value: g==='Non dépensé' ? Math.max(0,fd.inc-spent) : leaves.filter(l=>l.g===g).reduce((s,l)=>s+l.value,0)})).filter(x=>x.value>0.5);
  const src = Math.max(fd.inc, spent);
  const pad=8, minSlot=15, nL=leaves.length;

  let y=0, lastG=null; leaves.forEach(l=>{ if(lastG && lastG!==l.g) y+=4; lastG=l.g; l.h=Math.max(1,l.value*k); const slot=Math.max(l.h,minSlot); l.y=y+(slot-l.h)/2; l.cy=y+slot/2; y+=slot+2; });
  const Hl=y-2, Hg=src*k+pad*(groups.length-1), H=Math.max(Hl,Hg)+4;
  const gTop=(H-Hg)/2, lTop=(H-Hl)/2;
  leaves.forEach(l=>{ l.y+=lTop; l.cy+=lTop; });
  const X0=0, W0=18, X1=138, W1=8, X2=226, W2=6;
  const sTop = gTop, sH = src*k;
  let gy=gTop, sy=sTop, links='', nodes='', labels='', lastLab=-99;
  const rib=(xa,ya,xb,yb,h,col)=>{ const xm=(xa+xb)/2; return `<path d="M${xa},${ya}C${xm},${ya} ${xm},${yb} ${xb},${yb}L${xb},${yb+h}C${xm},${yb+h} ${xm},${ya+h} ${xa},${ya+h}Z" fill="${col}" opacity=".28"/>`; };

    nodes += `<rect x="${X1}" y="${gy}" width="${W1}" height="${Math.max(h,1)}" rx="2" fill="${G.col}"><title>${esc(G.g)} : ${tl(G.value)}</title></rect>`;
    let cy=Math.max(gy+h/2, (G.prevLab??-99)+0);
    cy = Math.max(cy, lastLab+25); lastLab = cy;
    labels += `<text x="${X1-5}" y="${cy-2}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)" ${halo}>${esc(G.g)}</text><text x="${X1-5}" y="${cy+10}" text-anchor="end" font-size="10" fill="var(--mute)" ${halo}>${tl(G.value)}</text>`;
    let oy=gy;
    leaves.filter(l=>l.g===G.g).forEach(l=>{
      links += rib(X1+W1, oy, X2, l.y, l.h, G.col); oy+=l.h;
      nodes += `<rect x="${X2}" y="${l.y}" width="${W2}" height="${l.h}" rx="1.5" fill="${G.col}"><title>${esc(l.name)} : ${tl2(l.value)}</title></rect>`;
      const nm = l.name.length>15 ? l.name.slice(0,14)+'…' : l.name;
      labels += `<text x="${X2+W2+5}" y="${l.cy+3.5}" font-size="10" fill="var(--ink)">${esc(nm)} <tspan fill="var(--mute)">${tl(l.value)}</tspan></text>`;
    });
    sy+=h; gy+=h+pad;
  });
  nodes += `<rect x="${X0}" y="${sTop}" width="${W0}" height="${sH}" rx="3" fill="var(--pri)"/>`;
  labels += `<text transform="translate(${X0+W0/2+4},${sTop+sH/2}) rotate(-90)" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${fd.inc>=spent?'Revenus ':'Dépenses '}${tl(src)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Flux du budget">${links}${nodes}${labels}</svg>`;
}

const typeName = t => (ASSET_TYPES.find(x=>x[0]===t)||[0,'Autre'])[1];
function trackedFlow(from, to){ // somme des mouvements importés avec from < date <= to (dates AAAA-MM-JJ)
  let s=0; S.expenses.forEach(e=>{ if(e.src==='import' && e.date>from && e.date<=to) s-=+e.amount; }); S.credits.forEach(c=>{ if(c.date>from && c.date<=to) s+=+c.amount; }); return s;
}
function valAt(a, m){
  if(a.track && a.refDate){ const first=importedMonths()[0]; if(first && m<first && m<a.refDate.slice(0,7)) return null; const end=m+'-31';
    return Math.round(((+a.refBalance||0) + (end>a.refDate ? trackedFlow(a.refDate,end) : -trackedFlow(end,a.refDate)))*100)/100; }
  const h=a.history||{}; const ks=Object.keys(h).filter(k=>k<=m).sort(); return ks.length ? +h[ks[ks.length-1]] : null; }
function debtAt(d, m){
  let B=+d.balance||0; const r=(+d.rate||0)/1200, P=+d.payment||0; if(!P) return B;
  const k=monthDiff(d.ref||thisYM(), m);
  if(k>=0){ for(let i=0;i<k;i++){ B=B*(1+r)-P; if(B<=0) return 0; } }
  else { for(let i=0;i<-k;i++){ B=(B+P)/(1+r); if(d.initial && B>=+d.initial) return +d.initial; } }
  return B;
}
function debtEnd(d){ let B=debtAt(d,thisYM()); const r=(+d.rate||0)/1200, P=+d.payment||0; if(!P || B<=0) return null; let m=thisYM(); for(let i=0;i<720 && B>0;i++){ B=B*(1+r)-P; m=addMonths(m,1); if(B>0 && B*(r)>=P) return null; } return m; }
const assetsAt = m => S.assets.reduce((s,a)=>s+(valAt(a,m)||0),0);
const debtsAt = m => S.debts.reduce((s,d)=>s+debtAt(d,m),0);
const netAt = m => assetsAt(m) - debtsAt(m);
function netMonths(){
  const ks = S.assets.flatMap(a=>a.track&&a.refDate ? [importedMonths()[0]||a.refDate.slice(0,7)] : Object.keys(a.history||{})).filter(Boolean).sort();
  if(!ks.length) return [thisYM()];
  let first = ks[0]; const cur=thisYM(); if(monthDiff(first,cur)>23) first=addMonths(cur,-23);
  const out=[]; for(let m=first; m<=cur; m=addMonths(m,1)) out.push(m); return out;
}
function lineChart(points, color){
  // points: [{label, value}]
  const W=340, H=150, pl=4, pr=4, pt=14, pb=20;
  const vs=points.map(p=>p.value), mn=Math.min(...vs), mx=Math.max(...vs), span=(mx-mn)||Math.abs(mx)||1;
  const x=i=>pl+(points.length===1?0.5:i/(points.length-1))*(W-pl-pr), y=v=>pt+(1-(v-mn)/span)*(H-pt-pb);
  const pts=points.map((p,i)=>[x(i),y(p.value)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const area=line+`L${pts[pts.length-1][0]},${H-pb}L${pts[0][0]},${H-pb}Z`;
  const short = m => new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">

    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.5:2}" fill="${color}"><title>${short(points[i].label)} : ${tl(points[i].value)}</title></circle>`).join('')}
    <text x="${pl}" y="${H-5}" font-size="10" fill="var(--mute)">${short(points[0].label)}</text>
    <text x="${W-pr}" y="${H-5}" font-size="10" fill="var(--mute)" text-anchor="end">${short(points[points.length-1].label)}</text>
    <text x="${W-pr}" y="10" font-size="10" fill="var(--mute)" text-anchor="end">max ${tl(mx)}</text>

  openSheet(`<form><h3>${isNew?'Nouvelle dette':'Modifier la dette'}</h3>
    <label>Nom</label><input name="name" required value="${esc(dt.name||'')}" placeholder="Ex. Prêt immobilier">
    <label>Type</label><select name="kind">${[['immo','Crédit immobilier'],['auto','Crédit auto'],['conso','Crédit conso / autre']].map(([v,n])=>`<option value="${v}" ${dt.kind===v?'selected':''}>${n}</option>`).join('')}</select>
    <div class="grid2"><div><label>Capital restant dû (€)</label><input name="balance" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(dt.balance??'')}"></div>
    <div><label>À la date de</label><input name="ref" type="month" required value="${esc(dt.ref)}"></div></div>
    <div class="grid2"><div><label>Mensualité hors assurance (€)</label><input name="payment" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(dt.payment??'')}"></div>
    <div><label>Taux annuel (%)</label><input name="rate" type="number" inputmode="decimal" step="0.001" min="0" value="${esc(dt.rate??'')}"></div></div>
    <label>Montant emprunté au départ (€, facultatif)</label><input name="initial" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(dt.initial??'')}">
    <p class="note">Avec la mensualité et le taux, le capital restant baisse tout seul chaque mois et la date de fin est calculée. Ces informations figurent sur ton relevé ou ton tableau d'amortissement.</p>
    <div class="actions">${isNew?'':delBtn('dDel')}<button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
  d=>{ const o={name:d.name, kind:d.kind, balance:+d.balance||0, ref:d.ref||thisYM(), payment:+d.payment||0, rate:+d.rate||0, initial:+d.initial||0};
    if(isNew) S.debts.push({id:uid(),...o}); else Object.assign(dt,o); });
  if(!isNew) $('#dDel').onclick=()=>confirmSheet('Supprimer « '+dt.name+' » ?',()=>S.debts=S.debts.filter(x=>x.id!==dt.id));
}

function goalAdd(g){
  openSheet(`<form><h3>${esc(g.emoji||'🎯')} ${esc(g.name)}</h3>
    <label>Montant à ajouter (€) — mets un montant négatif pour retirer</label><input name="amt" type="number" inputmode="decimal" step="0.01" required>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Ajouter</button></div></form>`,
  d=>{ g.saved=Math.max(0, Math.round(((+g.saved||0)+(+d.amt||0))*100)/100); if(g.saved>=g.target) setTimeout(()=>toast('🎉 Objectif atteint !'),50); });

/* ================== BUDGETS PAR CATÉGORIE ================== */
function catSpent(m){
  const o={}; varExp(m).forEach(e=>o[e.category]=(o[e.category]||0)+ +e.amount);
  monthObligations(m).forEach(x=>{ if(x.kind==='rec' && x.paid){ const c=x.ref.category||'Autre'; o[c]=(o[c]||0)+x.amount; } });
  return o;
}
function catAvg(c, n){ const cur=thisYM(); let s=0, k=0; for(let i=1;i<=n;i++){ const m=addMonths(cur,-i); const v=catSpent(m)[c]||0; if(S.expenses.some(e=>e.date.slice(0,7)===m)){ s+=v; k++; } } return k? s/k : 0; }
function budgetRows(m){
  const sp=catSpent(m);
  return Object.entries(S.budgets).filter(([c,v])=>+v>0).map(([c,v])=>({c, lim:+v, sp:Math.max(0,sp[c]||0), pc:Math.max(0,sp[c]||0)/+v*100})).sort((a,b)=>b.pc-a.pc);
}
function budgetCard(m){
  const rows=budgetRows(m);
  if(!rows.length) return (S.expenses.length?`<div class="card"><h2>Budgets <button class="btn sm ghost" id="budEdit">Définir</button></h2><div class="note">Fixe un plafond par catégorie (Courses, Eda…) et suis-le au fil du mois.</div></div>`:'');
  const tot=rows.reduce((s,r)=>s+r.lim,0), tsp=rows.reduce((s,r)=>s+r.sp,0);
  const [y,mo]=m.split('-').map(Number), dim=new Date(y,mo,0).getDate(), day=m===thisYM()?new Date().getDate():dim;
  return `<div class="card"><h2>Budgets du mois <button class="btn sm ghost" id="budEdit">Modifier</button></h2>
    <div class="note" style="margin-bottom:4px">${tl(tsp)} dépensés sur ${tl(tot)} · jour ${day}/${dim}</div>
    ${rows.map(r=>{ const col = r.pc>100?'var(--bad)':r.pc>=80?'var(--warn)':'var(--ok)';
      return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px;gap:8px"><span>${r.pc>100?'⚠️ ':''}${esc(r.c)}</span>
      <span class="amt">${tl(r.sp)} <span class="note">/ ${tl(r.lim)}</span></span></div>
      <div class="bar" style="position:relative"><i style="width:${Math.min(100,r.pc)}%;background:${col}"></i><span style="position:absolute;top:-2px;bottom:-2px;left:${day/dim*100}%;width:2px;background:var(--mute);opacity:.5"></span></div>
      <div class="s" style="font-size:12px;color:${r.pc>100?'var(--bad)':'var(--mute)'}">${r.pc>100?'Dépassé de '+tl(r.sp-r.lim):'Reste '+tl(r.lim-r.sp)}</div></div>`; }).join('')}
  </div>`;
}
function budgetAlert(m){ const over=budgetRows(m).filter(r=>r.pc>100); return over.length?`<div class="tip b">⚠️ Budget dépassé : ${over.map(r=>esc(r.c)+' (+'+tl(r.sp-r.lim)+')').join(', ')}</div>`:''; }
function budgetForm(){
  const sugg={}; CATS.forEach(c=>{ const a=catAvg(c,3); if(a>0) sugg[c]=Math.ceil(a/10)*10; });
  openSheet(`<form><h3>Budgets mensuels</h3>
    <p class="note">Laisse vide pour ne pas suivre une catégorie. Les dépenses régulières payées (loyer, assurances…) comptent dans leur catégorie.</p>
    <button type="button" class="btn ghost" id="budSug" style="width:100%;margin:6px 0">✨ Remplir avec mes moyennes des 3 derniers mois</button>
    ${CATS.map(c=>`<div class="row" style="padding:6px 0"><div class="grow"><div class="t">${esc(c)}</div>${sugg[c]?`<div class="s">moyenne ≈ ${tl(sugg[c])}</div>`:''}</div>
      <input name="b_${esc(c)}" type="number" inputmode="decimal" min="0" step="10" value="${S.budgets[c]||''}" placeholder="—" style="width:110px;text-align:right"></div>`).join('')}
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
  d=>{ const b={}; CATS.forEach(c=>{ const v=+d['b_'+c]; if(v>0) b[c]=v; }); S.budgets=b; });
  $('#budSug').onclick=()=>{ CATS.forEach(c=>{ const i=$('#sheet input[name="b_'+c+'"]'); if(i && !i.value && sugg[c]) i.value=sugg[c]; }); };
}

/* ================== TENDANCES ================== */
let trendCat = null;
function barChart(items, opts){
  // items: [{label, value, color?}]
  opts=opts||{}; const W=340, H=opts.h||140, pb=18, pt=14;
  const cl = v => opts.clamp ? Math.max(-opts.clamp, Math.min(opts.clamp, v)) : v;
  const mx=Math.max(1e-9,...items.map(i=>Math.abs(cl(i.value)))), hasNeg=items.some(i=>i.value<0);
  const zero = hasNeg ? pt+(H-pt-pb)/2 : H-pb, sc=(hasNeg?(H-pt-pb)/2:(H-pt-pb))/mx;
  const bw=(W-8)/items.length;
  const short = m => new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>
    ${items.map((it,i)=>{ const h=Math.abs(cl(it.value))*sc, x=4+i*bw+bw*0.15, w=bw*0.7, yy=it.value>=0?zero-h:zero;
      return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h,it.value?1:0)}" rx="3" fill="${it.color||'var(--pri)'}" opacity="${it.dim?0.45:1}"><title>${short(it.label)} : ${opts.fmt?opts.fmt(it.value):tl(it.value)}</title></rect>
        <text x="${x+w/2}" y="${H-5}" font-size="9" fill="var(--mute)" text-anchor="middle">${short(it.label)}</text>
        ${opts.labels?`<text x="${x+w/2}" y="${it.value>=0?yy-3:(h>18?yy+h-5:yy+h+10)}" font-size="8.5" fill="${it.value<0&&h>18?'#fff':'var(--ink)'}" font-weight="600" text-anchor="middle">${opts.fmt?opts.fmt(it.value):''}</text>`:''}`; }).join('')}
  </svg>`;
}
function trendCards(){
  const months = historyMonths().slice(0,12).reverse();
  const cur=thisYM();
  // taux d'épargne
  const rates = months.map(m=>{ const R=monthReport(m), ep=catSpent(m)['Épargne']||0; return {label:m, value: R.inc? (R.inc-(R.total-ep))/R.inc*100 : null, dim:m===cur}; }).filter(x=>x.value!=null);
  const full = rates.filter(r=>r.label!==cur), avg = full.length? full.reduce((s,r)=>s+r.value,0)/full.length : null;
  rates.forEach(r=>r.color = r.value<0?'var(--bad)':'var(--ok)');
  // évolution par catégorie
  const totals={}; months.forEach(m=>{ const o=catSpent(m); Object.entries(o).forEach(([c,v])=>totals[c]=(totals[c]||0)+v); });
  const cats=Object.entries(totals).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(!trendCat || !cats.includes(trendCat)) trendCat=cats[0];
  const series = months.map(m=>({label:m, value:Math.max(0,catSpent(m)[trendCat]||0), dim:m===cur, color:'var(--c1)'}));
  const s6 = series.filter(x=>x.label!==cur).slice(-6), a6 = s6.length? s6.reduce((s,x)=>s+x.value,0)/s6.length : 0;
  // comparaison mois affiché vs précédent
  const A=catSpent(repMonth), B=catSpent(addMonths(repMonth,-1));
  const comp = [...new Set([...Object.keys(A),...Object.keys(B)])].map(c=>({c,a:Math.max(0,A[c]||0),b:Math.max(0,B[c]||0)})).filter(x=>x.a||x.b).sort((x,y)=>y.a-x.a);
  return `
  ${rates.length?`<div class="card"><h2>Taux d'épargne</h2>
    <div class="note">Part du revenu non dépensée ou placée${avg!=null?` · moyenne <b class="${avg<0?'neg':'pos'}">${num(avg,0)} %</b>`:''}</div>
    ${barChart(rates,{fmt:v=>num(v,0)+' %', labels:true, clamp:100, h:160})}
    <div class="note">Le mois en cours (plus clair) n'est pas encore terminé.</div></div>`:''}
  ${cats.length?`<div class="card"><h2>Évolution par catégorie</h2>
    <select id="trendSel" style="margin-bottom:6px">${cats.map(c=>`<option ${c===trendCat?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <div class="note">Moyenne sur 6 mois : <b>${tl(a6)}</b>/mois</div>
    ${barChart(series)}</div>
  <div class="card"><h2>${monthName(repMonth)} vs mois précédent</h2>${repMonth===thisYM()?'<div class="note" style="margin-top:-6px">Mois en cours : les chiffres vont encore augmenter.</div>':''}
    <table>${comp.map(x=>{ const d=x.a-x.b, p=x.b? d/x.b*100 : null;
      return `<tr><td>${esc(x.c)}</td><td style="text-align:right">${tl(x.a)} <span style="font-size:12px;color:${d>0?'var(--bad)':d<0?'var(--ok)':'var(--mute)'}">${d>0?'▲':d<0?'▼':'='} ${p!=null&&isFinite(p)?num(Math.abs(p),0)+' %':tl(Math.abs(d))}</span></td></tr>`; }).join('')}</table></div>`:''}`;
}

/* ================== ABONNEMENTS ================== */
function priceChanges(){
  return liveRecurring().map(r=>{ const pm=r.paidAmt||{}; const ks=Object.keys(pm).filter(k=>pm[k]>0).sort(); if(ks.length<2) return null;
    const last=+pm[ks[ks.length-1]], prev=+pm[ks[ks.length-2]];
    return (last-prev>=0.5 && last>prev*1.02) ? {r, prev, last, m:ks[ks.length-1]} : null; }).filter(Boolean);
}
function abosBody(){
  const subs = liveRecurring().filter(r=>r.category==='Abonnements').sort((a,b)=>b.amount-a.amount);
  const all = liveRecurring().slice().sort((a,b)=>b.amount-a.amount);
  const sm = subs.reduce((s,r)=>s+ +r.amount,0), am = all.reduce((s,r)=>s+ +r.amount,0);
  const ch = priceChanges();
  const row = r => `<div class="row"><div class="grow" data-edit-rec="${r.id}"><div class="t">${esc(r.name)}</div><div class="s">${tl2(+r.amount)}/mois · ${esc(r.category)}</div></div><div style="text-align:right"><div class="amt">${tl(r.amount*12)}</div><div class="s">par an</div></div></div>`;
  return `<div class="grid2"><div class="stat"><div class="l">Abonnements</div><div class="v">${tl(sm)}<span class="note">/mois</span></div><div class="note">${tl(sm*12)} par an</div></div>
    <div class="stat"><div class="l">Tous les prélèvements</div><div class="v">${tl(am)}<span class="note">/mois</span></div><div class="note">${tl(am*12)} par an</div></div></div>
  ${ch.length?`<div class="card" style="border-color:var(--warn)"><h2 class="wrn">📈 Hausses de prix détectées</h2>${ch.map(x=>`<div class="row"><div class="grow" data-edit-rec="${x.r.id}"><div class="t">${esc(x.r.name)}</div><div class="s">${monthName(x.m)} · ${tl2(x.prev)} → ${tl2(x.last)}</div></div><div class="amt neg">+${num((x.last/x.prev-1)*100,1)} %</div></div>`).join('')}</div>`:''}
  <div class="card"><h2>Abonnements</h2>${subs.length?subs.map(row).join(''):'<div class="empty">Aucun paiement régulier dans la catégorie « Abonnements ». Touche un prélèvement ci-dessous pour changer sa catégorie.</div>'}</div>
  <div class="card"><h2>Coût annuel de tous les prélèvements</h2>${all.length?all.map(row).join(''):'<div class="empty">Aucun paiement régulier.</div>'}</div>`;
}
function bindPie(){
  $('#view').querySelectorAll('[data-pie]').forEach(el=>el.onclick=()=>{ const [id,i]=el.dataset.pie.split(':'); repActive[id] = repActive[id]===+i ? null : +i; const y=window.scrollY; render(); window.scrollTo(0,y); });
}

if((S.catVer||0)<4){
  const ren = c => c==='Crèche' ? 'Eda' : c;
  S.expenses.forEach(e=>e.category=ren(e.category)); S.recurring.forEach(r=>r.category=ren(r.category)); Object.keys(S.catRules).forEach(k=>S.catRules[k]=ren(S.catRules[k]));
  S.credits = S.credits.filter(c=>{ if(isRefund(c.label||'')){ S.expenses.push({id:uid(), date:c.date, amount:-c.amount, category:guessCat(c.label,c.key), note:prettyKey(c.key)||c.label, label:c.label, key:c.key, h:c.h, src:'import', refund:true}); return false; } return true; });
  S.expenses.forEach(e=>{ if(e.src==='import' && !(e.key && S.catRules[e.key])) e.category = guessCat(e.label||e.note, e.key); });
  S.recurring.forEach(r=>{ if(r.match && !S.catRules[r.match]){ const c=guessCat(r.name+' '+r.match, r.match); if(c!=='Autre') r.category=c; } });
  S.catVer=4; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

  else if(tab==='odeme') sub.odeme==='taksit'?instForm():sub.odeme==='abos'?recForm({day:1,category:'Abonnements'}):recForm();
  else if(tab==='patri') openSheet(`<h3>Ajouter</h3><div style="display:grid;gap:8px"><button class="btn ghost" id="fa">🏦 Un avoir (compte, livret, placement, bien…)</button><button class="btn ghost" id="fd">🏠 Une dette (crédit)</button><button class="btn ghost" id="fg">🎯 Un objectif d'épargne</button></div><div class="actions"><button class="btn ghost" data-close>Annuler</button></div>`), $('#fa')&&($('#fa').onclick=()=>assetForm(), $('#fd').onclick=()=>debtForm(), $('#fg').onclick=()=>goalForm());
};

syncReminders();
setInterval(browserReminderTick, 15000); browserReminderTick();
